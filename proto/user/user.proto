syntax = "proto3";

package relayx.user.v1;
import "common/common.proto";

service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc CheckHealth (relayx.common.v1.Empty) returns (HealthCheckResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
}

message HealthCheckResponse {
  relayx.common.v1.HealthStatus status = 1;
}