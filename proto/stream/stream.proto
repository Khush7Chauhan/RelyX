syntax = "proto3";
package relayx.stream.v1;

service StreamHubService {
  rpc SubscribeToEvents (SubscribeRequest) returns (stream EventMessage);
  rpc SyncChannel (stream ClientMessage) returns (stream EventMessage);
}

message SubscribeRequest {
  string client_id = 1;
  repeated string topics = 2;
}

message EventMessage {
  string event_id = 1;
  string topic = 2;
  string payload_json = 3; 
  int64 timestamp = 4;
}

message ClientMessage {
  string client_id = 1;
  string action = 2;
  string payload_json = 3;
}